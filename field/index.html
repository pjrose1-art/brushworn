<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Brushworn</title>

<!-- =====================================================================
     QR REDIRECT  ·  brushworn.com/field

     Scanning the code lands here, then bounces straight to the signup band (#guide) carrying ?src=field,
     which the hidden source input reads and sends to Klaviyo as a profile property.

     To repoint this code later (a different page, a different campaign),
     change the DEST value below and the printed cards keep working.
     ===================================================================== -->
<script>
  var DEST = "../?src=field#guide";
  window.location.replace(DEST);
</script>
<meta http-equiv="refresh" content="0; url=../?src=field#guide">
<link rel="canonical" href="https://brushworn.com/">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.ico" sizes="any">
<style>
  html,body{height:100%}
  body{margin:0;background:#211D17;color:#F2EDE2;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .wm{font-family:Georgia,'Times New Roman',serif;font-weight:bold;font-size:26px;
    letter-spacing:.10em;text-transform:uppercase;color:#F2EDE2;
    border-top:1.5px solid #E0611F;border-bottom:1.5px solid #E0611F;
    padding:9px 0 8px;display:inline-block}
  p{margin:26px 0 0;font-size:15px;line-height:1.6;color:rgba(242,237,226,.7)}
  a{color:#E0611F}
</style>
</head>
<body>
  <div>
    <span class="wm">Brushworn</span>
    <p>Taking you to the guide.<br>
    <a href="../?src=field#guide">Tap here if nothing happens.</a></p>
  </div>
</body>
</html>
